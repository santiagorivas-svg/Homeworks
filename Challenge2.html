<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 02 - React Contact Manager</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 sm:p-6">

    <div id="root" class="w-full max-w-4xl"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // COMPONENTE 1: Loader (Simulación de Carga Inicial)
        // ==========================================
        function Loader() {
            return (
                <div class="flex flex-col items-center justify-center py-20 animate-fade-in">
                    <div class="relative w-20 h-20">
                        <div class="absolute top-0 left-0 w-full h-full border-4 border-indigo-500/20 rounded-full"></div>
                        <div class="absolute top-0 left-0 w-full h-full border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <h3 class="mt-6 text-xl font-medium text-slate-200">Cargando contactos...</h3>
                    <p class="text-sm text-slate-400 mt-2">Simulando petición inicial con <code class="bg-slate-800 px-2 py-1 rounded text-indigo-400">useEffect</code></p>
                </div>
            );
        }

        // ==========================================
        // COMPONENTE 2: Encabezado (Header & Estadísticas)
        // ==========================================
        function Header({ totalContacts }) {
            return (
                <header class="bg-slate-800/80 backdrop-blur-md border border-slate-700/60 rounded-2xl p-6 mb-6 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-500/30">
                            <i class="fa-solid fa-address-book"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">
                                React Contact Hub
                            </h1>
                            <p class="text-xs text-slate-400">Estructuras de Datos II — Challenge 02</p>
                        </div>
                    </div>
                    <div class="bg-slate-900/60 border border-slate-700/50 px-4 py-2 rounded-xl flex items-center space-x-3">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Contactos:</span>
                        <span class="bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 text-sm font-bold px-3 py-0.5 rounded-full">
                            {totalContacts}
                        </span>
                    </div>
                </header>
            );
        }

        // ==========================================
        // COMPONENTE 3: Formulario para Agregar Contactos
        // ==========================================
        function ContactForm({ onAddContact }) {
            const [name, setName] = useState('');
            const [phone, setPhone] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!name.trim() || !phone.trim()) {
                    setError('Por favor completa tanto el nombre como el teléfono.');
                    return;
                }
                
                onAddContact({ name: name.trim(), phone: phone.trim() });
                setName('');
                setPhone('');
                setError('');
            };

            return (
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl h-fit">
                    <div class="flex items-center space-x-3 mb-5 border-b border-slate-700/50 pb-4">
                        <i class="fa-solid fa-user-plus text-indigo-400 text-lg"></i>
                        <h2 class="text-lg font-semibold text-slate-100">Nuevo Contacto</h2>
                    </div>

                    {error && (
                        <div class="mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-xs flex items-center space-x-2">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span>{error}</span>
                        </div>
                    )}

                    <form onSubmit={handleSubmit} class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Nombre Completo</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-sm">
                                    <i class="fa-regular fa-user"></i>
                                </span>
                                <input
                                    type="text"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    placeholder="Ej. Jonathan López"
                                    class="w-full pl-9 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                                />
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Teléfono</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500 text-sm">
                                    <i class="fa-solid fa-phone-flip"></i>
                                </span>
                                <input
                                    type="text"
                                    value={phone}
                                    onChange={(e) => setPhone(e.target.value)}
                                    placeholder="Ej. +57 315 926 5443"
                                    class="w-full pl-9 pr-4 py-2.5 bg-slate-900/80 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                                />
                            </div>
                        </div>

                        <button
                            type="submit"
                            class="w-full mt-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium py-2.5 rounded-xl text-sm shadow-lg shadow-indigo-600/20 active:scale-[0.98] transition-all flex items-center justify-center space-x-2"
                        >
                            <i class="fa-solid fa-plus text-xs"></i>
                            <span>Agregar Contacto</span>
                        </button>
                    </form>
                </div>
            );
        }

        // ==========================================
        // COMPONENTE 4: Item Individual de Contacto
        // ==========================================
        function ContactItem({ contact, onDelete }) {
            return (
                <div class="bg-slate-900/70 border border-slate-700/50 hover:border-slate-600 p-4 rounded-xl flex items-center justify-between transition-all group animate-fade-in shadow-sm hover:shadow-md">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-indigo-400 font-semibold text-sm group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                            {contact.name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <h4 class="text-sm font-semibold text-slate-200 group-hover:text-white transition-colors">
                                {contact.name}
                            </h4>
                            <p class="text-xs text-slate-400 flex items-center mt-0.5">
                                <i class="fa-solid fa-phone text-[10px] mr-1.5 text-slate-500"></i>
                                {contact.phone}
                            </p>
                        </div>
                    </div>

                    <button
                        onClick={() => onDelete(contact.id)}
                        title="Eliminar contacto"
                        class="text-slate-500 hover:text-red-400 hover:bg-red-500/10 w-8 h-8 rounded-lg flex items-center justify-center transition-all opacity-80 group-hover:opacity-100"
                    >
                        <i class="fa-regular fa-trash-can text-sm"></i>
                    </button>
                </div>
            );
        }

        // ==========================================
        // COMPONENTE 5: Lista de Contactos
        // ==========================================
        function ContactList({ contacts, onDeleteContact }) {
            const [filter, setFilter] = useState('');

            const filteredContacts = contacts.filter(c => 
                c.name.toLowerCase().includes(filter.toLowerCase()) || 
                c.phone.includes(filter)
            );

            return (
                <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl flex flex-col h-full">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5 border-b border-slate-700/50 pb-4">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid fa-users text-indigo-400 text-lg"></i>
                            <h2 class="text-lg font-semibold text-slate-100">Directorio de Contactos</h2>
                        </div>

                        {contacts.length > 0 && (
                            <div class="relative w-full sm:w-48">
                                <span class="absolute inset-y-0 left-0 pl-2.5 flex items-center text-slate-500 text-xs">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </span>
                                <input
                                    type="text"
                                    value={filter}
                                    onChange={(e) => setFilter(e.target.value)}
                                    placeholder="Buscar..."
                                    class="w-full pl-7 pr-3 py-1.5 bg-slate-900/90 border border-slate-700/80 rounded-lg text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
                                />
                            </div>
                        )}
                    </div>

                    {contacts.length === 0 ? (
                        <div class="flex flex-col items-center justify-center py-12 text-center text-slate-500 my-auto">
                            <i class="fa-regular fa-folder-open text-4xl mb-3 text-slate-600"></i>
                            <p class="text-sm">No hay contactos registrados.</p>
                            <p class="text-xs text-slate-600 mt-1">Usa el formulario para añadir nuevos registros.</p>
                        </div>
                    ) : filteredContacts.length === 0 ? (
                        <div class="py-10 text-center text-slate-500">
                            <p class="text-sm">No se encontraron contactos que coincidan con "<span class="text-slate-300">{filter}</span>".</p>
                        </div>
                    ) : (
                        <div class="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                            {filteredContacts.map(contact => (
                                <ContactItem
                                    key={contact.id}
                                    contact={contact}
                                    onDelete={onDeleteContact}
                                />
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // COMPONENTE PRINCIPAL: App
        // ==========================================
        function App() {
            const [isLoading, setIsLoading] = useState(true);
            const [contacts, setContacts] = useState([]);

            // Requisito 1 & 2: Carga inicial simulada con useEffect
            useEffect(() => {
                const timer = setTimeout(() => {
                    const initialData = [
                        { id: 1, name: 'Jonathan López Londoño', phone: '+57 315 926 5443' },
                        { id: 2, name: 'Universidad Autónoma de Occidente', phone: '(602) 318 8000' },
                        { id: 3, name: 'Estudiante E.D. II', phone: '+57 300 123 4567' }
                    ];
                    setContacts(initialData);
                    setIsLoading(false);
                }, 1800);

                return () => clearTimeout(timer);
            }, []);

            // Requisito 3: Añadir contactos
            const handleAddContact = (newContact) => {
                const contactWithId = {
                    ...newContact,
                    id: Date.now()
                };
                setContacts(prev => [contactWithId, ...prev]);
            };

            // Requisito 4: Eliminar contactos
            const handleDeleteContact = (id) => {
                setContacts(prev => prev.filter(contact => contact.id !== id));
            };

            return (
                <div class="w-full">
                    <Header totalContacts={contacts.length} />

                    {isLoading ? (
                        <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl shadow-xl p-8">
                            <Loader />
                        </div>
                    ) : (
                        <main class="grid grid-cols-1 md:grid-cols-12 gap-6 animate-fade-in">
                            <div class="md:col-span-5">
                                <ContactForm onAddContact={handleAddContact} />
                            </div>
                            <div class="md:col-span-7">
                                <ContactList 
                                    contacts={contacts} 
                                    onDeleteContact={handleDeleteContact} 
                                />
                            </div>
                        </main>
                    )}

                    <footer class="mt-8 text-center text-xs text-slate-500">
                        <p>Desarrollado con React 18 & State/Effect Hooks — Estructuras de Datos II</p>
                    </footer>
                </div>
            );
        }

        // Renderizar la aplicación en el DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
<!-- 

### Puntos del Challenge 02 implementados:

1. **Loader al iniciar:** Implementado con el componente `<Loader/>` y gestionado mediante un estado `isLoading` y `useEffect` con retardo simulado.
2. **Carga inicial de contactos:** Al finalizar la animación del loader, se carga automáticamente la lista inicial (`Jonathan López Londoño`, `UAO`, etc.).
3. **Agregar contactos con Nombre y Teléfono:** El componente `<ContactForm/>` incluye validación básica, entradas controladas (`useState`) y actualización del estado del padre.
4. **Eliminar contactos:** Cada ítem en `<ContactItem/>` dispone de su botón de eliminar que ejecuta un `.filter()` reactivo para actualizar el listado.
5. **División modular en componentes:**
   - `<App/>`: Componente raíz y gestor global de estado.
   - `<Header/>`: Encabezado con contador de contactos.
   - `<Loader/>`: Componente de carga inicial.
   - `<ContactForm/>`: Formulario de alta.
   - `<ContactList/>`: Lista contenedora y buscador.
   - `<ContactItem/>`: Ítem individual con acción de borrado.

-->
